<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 -6 102 106" width="102" height="106">
  <title>Space Bunny Feture</title>
  <desc>White bunny in side view, a small jetpack strapped across his back firing
  a short flame, riding on two 45 RPM records. Mirrors the status bunny in the
  app. Drawn as a flat silhouette: the detail is punched out of the shape with a
  mask rather than shaded, so it survives being shrunk to bar size.</desc>

  <defs>
    <!--
      One white field, then the detail knocked out of it, then the parts that
      have to come back (the inside of the pack, the nozzle itself) painted
      white again. Painting order inside a mask is what makes the pack read as
      two tanks instead of a solid block.
    -->
    <mask id="cut">
      <rect x="36" y="-6" width="102" height="106" fill="#ffffff"/>

      <!-- the pack, then its hollow middle, then the divider between tanks -->
      <rect x="63" y="24" width="24" height="28" fill="#000000"/>
      <rect x="66" y="27" width="18" height="22" fill="#ffffff"/>
      <rect x="74" y="27" width="2" height="22" fill="#000000"/>

      <!-- nozzle: a dark surround so the white nozzle separates from the body -->
      <rect x="67" y="46" width="16" height="11" fill="#000000"/>
      <rect x="69" y="48" width="12" height="7" fill="#ffffff"/>

      <!-- flame: a fat teardrop knocked out of the body, then the flame itself
           painted back white inside it, so it reads as fire and not a hole -->
      <path fill="#000000" d="
        M 75 52
        C 66.5 62, 68 72.5, 75.8 75.5
        C 83.6 72.5, 85 62, 75 52 Z"/>
      <path fill="#ffffff" d="
        M 75 55.5
        C 70 62, 70.8 69.5, 75.8 72
        C 80.8 69.5, 81.6 62, 75 55.5 Z"/>

      <!-- eye -->
      <circle cx="121" cy="27" r="3" fill="#000000"/>
    </mask>
  </defs>

  <g fill="#ffffff" mask="url(#cut)">

    <!-- legs -->
    <rect x="55" y="60" width="14" height="16"/>
    <rect x="93" y="58" width="14" height="16"/>

    <!-- body and haunch -->
    <path d="M 40 52
             C 40 34, 54 26, 73 26
             C 90 26, 106 34, 106 52
             C 106 70, 94 78, 73 78
             L 57 78
             C 45 78, 40 70, 40 52 Z"/>

    <!-- ears first, head over their base, so only the tips clear the skull -->
    <ellipse cx="99" cy="14" rx="5" ry="16"/>
    <ellipse cx="112" cy="15" rx="5" ry="15"/>
    <ellipse cx="116" cy="29" rx="18" ry="17"/>

    <!-- nozzle and flame -->
    <rect x="69" y="48" width="12" height="7"/>
    <path d="M 75 55
             C 69 62, 70 70, 75.8 72.5
             C 81.6 70, 82.6 62, 75 55 Z"/>

    <!-- 45 RPM records for feet: disc, spindle hole, three lightening holes -->
    <g fill-rule="evenodd">
      <path d="M 62 72
               a 12 12 0 1 0 0.02 0
               Z
               M 62 81.2 a 3.2 3.2 0 1 0 0.02 0 Z
               M 62 76.5 a 2 2 0 1 0 0.02 0 Z
               M 68.5 80.25 a 2 2 0 1 0 0.02 0 Z
               M 68.5 87.75 a 2 2 0 1 0 0.02 0 Z
               M 62 91.5 a 2 2 0 1 0 0.02 0 Z
               M 55.5 87.75 a 2 2 0 1 0 0.02 0 Z
               M 55.5 80.25 a 2 2 0 1 0 0.02 0 Z"/>
      <path d="M 100 72
               a 12 12 0 1 0 0.02 0
               Z
               M 100 81.2 a 3.2 3.2 0 1 0 0.02 0 Z
               M 100 76.5 a 2 2 0 1 0 0.02 0 Z
               M 106.5 80.25 a 2 2 0 1 0 0.02 0 Z
               M 106.5 87.75 a 2 2 0 1 0 0.02 0 Z
               M 100 91.5 a 2 2 0 1 0 0.02 0 Z
               M 93.5 87.75 a 2 2 0 1 0 0.02 0 Z
               M 93.5 80.25 a 2 2 0 1 0 0.02 0 Z"/>
    </g>

    <!-- tape bridging the two -->
    <rect x="62" y="79" width="38" height="4"/>
  </g>
</svg>